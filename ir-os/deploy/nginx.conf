# /etc/nginx/sites-available/ir-os
# Replace YOUR_DOMAIN with your actual domain (e.g. iros.yourcompany.com.br)
# After Certbot runs, it will auto-add the SSL section below.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Certbot will redirect this to HTTPS automatically.
    # Until then, the app is accessible on HTTP.

    # Security headers (complement express helmet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Increase upload limit to match Express (2mb JSON + 50mb file uploads)
    client_max_body_size 55M;

    # Proxy all traffic to the Node.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ── SSL block (added automatically by Certbot) ───────────────────────────────
# After running: sudo certbot --nginx -d YOUR_DOMAIN
# Certbot will append the HTTPS server block here and redirect HTTP → HTTPS.
